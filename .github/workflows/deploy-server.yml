# Deploys the multiplayer game server (server/) to Cloudflare Workers on demand
# (Actions -> Deploy game server -> Run workflow). Paused from running by itself
# (the owner's call, 2026-11: no automatic Cloudflare deploys for now); to resume,
# put back the push trigger under `on:`:
#   push:
#     branches: [main]
#     paths: [server/**, src/scripts/net/**, src/scripts/city3d/combat-sim.ts,
#             src/scripts/city3d/solids.ts, .github/workflows/deploy-server.yml]
#
# Needs two repository secrets (see server/README.md):
#   CLOUDFLARE_API_TOKEN  - an API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account ID
# Until they exist, the run finishes straight away with a note.
name: Deploy game server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare is set up
        id: setup
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Game server not deployed: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (server/README.md)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # The server bundles shared code from src/, which needs the site's three.js
      - if: steps.setup.outputs.ready == 'true'
        run: npm ci
      - if: steps.setup.outputs.ready == 'true'
        run: npm ci --prefix server
      - if: steps.setup.outputs.ready == 'true'
        run: npm run check --prefix server

      - name: Deploy
        if: steps.setup.outputs.ready == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
