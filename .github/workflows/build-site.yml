# Builds the site on every push to main (or on demand) and attaches it as a
# downloadable zip, ready to extract into public_html on Hostinger.
#
# To get it: GitHub -> Actions -> "Build site" -> the latest run ->
# Artifacts -> degenemporium-site.
name: Build site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The types, and nothing declared that's never used: a type error stops the build too.
      - run: npm run typecheck
      # The street plan, collisions, plots, driving and target practice rules (tests/).
      # A failing test stops the build, so a broken city never reaches the zip.
      - run: npm test
      # No multiplayer on degenemporium.com (the owner's call): built without a game server,
      # so the city runs on its own (the whole city game in this browser's save).
      # Multiplayer runs only on the workers.dev copy of the site (server/README.md): don't
      # set PUBLIC_GAME_SERVER here.
      - run: npm run build
      # The city's textures made ahead and GPU-compressed (scripts/bake-textures.mjs): painted in a
      # headless Chromium from the built site, then written into dist/. Playwright's own Chromium (the
      # runner's Chrome painted 11 of the desktop textures differently on its two runs, so they were
      # left out), cached between builds and installed without its system packages (the runner has
      # them already: installing them took 12 minutes). If it can't run, it says so and the site paints
      # them in the browser as before.
      - name: Cache Playwright's Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright-core install chromium
        continue-on-error: true
      - name: Make the textures
        timeout-minutes: 30
        # (stopped by the timeout, the site still builds: its list goes into the page last)
        continue-on-error: true
        run: npm run bake:textures
      # What a visitor downloads before the city is up, held to fixed sizes (scripts/budget.mjs):
      # a start that got heavier stops the build too.
      - run: npm run budget

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: degenemporium-site
          path: dist/
          # .htaccess starts with a dot, and hidden files are left out unless asked for
          include-hidden-files: true
          retention-days: 30
