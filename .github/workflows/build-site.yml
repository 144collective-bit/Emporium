# Builds the site on every push to main (or on demand), checks it, makes its textures, and:
# - on a push to main, publishes the finished site to the `deploy` branch, which Hostinger's Git link
#   deploys to degenemporium.com (docs/stability-plan.md, "The live site's textures": a plain build on
#   Hostinger had none of the textures made here, so every visitor's browser painted them, about four
#   times the graphics memory). Only a build that passed every check and made its textures is published;
# - attaches it as a downloadable zip too (GitHub -> Actions -> "Build site" -> the latest run ->
#   Artifacts -> degenemporium-site), ready to extract into public_html by hand if ever needed.
name: Build site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # (write: the push to the `deploy` branch below)
  contents: write

# A newer push to main replaces a run still going, so an older build never lands after a newer one
concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned, not ubuntu-latest: when ubuntu-latest became 26.04, Playwright (1.56) had no Chromium for it ("does not
    # support chromium on ubuntu26.04-x64"), so the textures weren't made and the budget failed every build. Move it
    # on together with a playwright-core that supports the newer image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The types, and nothing declared that's never used: a type error stops the build too.
      - run: npm run typecheck
      # The linter (eslint.config.js): prefer-const, eqeqeq, no DOM in the DOM-free rules files.
      - run: npm run lint
      # The street plan, collisions, plots, driving and target practice rules (tests/).
      # A failing test stops the build, so a broken city never reaches the zip.
      - run: npm test
      # No multiplayer on degenemporium.com (the owner's call): built without a game server,
      # so the city runs on its own (the whole city game in this browser's save).
      # Multiplayer runs only on the workers.dev copy of the site (server/README.md): don't
      # set PUBLIC_GAME_SERVER here.
      - run: npm run build
      # The city's textures made ahead and GPU-compressed (scripts/bake-textures.mjs): painted in a
      # headless Chromium from the built site, then written into dist/. Playwright's own Chromium (the
      # runner's Chrome painted 11 of the desktop textures differently on its two runs, so they were
      # left out), cached between builds and installed without its system packages (the runner has
      # them already: installing them took 12 minutes). If it can't run, it says so and the site paints
      # them in the browser as before.
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright-core install chromium
        continue-on-error: true
      - name: Make the textures
        id: bake
        timeout-minutes: 30
        # (stopped by the timeout, the site still builds: its list goes into the page last; but it isn't
        # published to the live site, below)
        continue-on-error: true
        run: npm run bake:textures
      # What a visitor downloads before the city is up, held to fixed sizes (scripts/budget.mjs):
      # a start that got heavier stops the build too.
      - run: npm run budget

      - uses: actions/upload-artifact@v4
        with:
          name: degenemporium-site
          path: dist/
          # .htaccess starts with a dot, and hidden files are left out unless asked for
          include-hidden-files: true
          retention-days: 30

      # The live site: the finished build, as one commit on the `deploy` branch (its whole history is
      # this one build, replaced each time). Hostinger deploys that branch as it is, with no build of its
      # own. Not when the textures weren't made: the live site keeps the last good build instead.
      - name: Publish to the deploy branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bake.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -q 'id="city-tex"' dist/index.html || { echo "dist/index.html has no texture list: not published"; exit 1; }
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site built from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
