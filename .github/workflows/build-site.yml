# Builds the site on every push to main (or on demand) and attaches it as a
# downloadable zip, ready to extract into public_html on Hostinger.
#
# To get it: GitHub -> Actions -> "Build site" -> the latest run ->
# Artifacts -> degenemporium-site.
name: Build site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The types, and nothing declared that's never used: a type error stops the build too.
      - run: npm run typecheck
      # The street plan, collisions, plots, driving and target practice rules (tests/).
      # A failing test stops the build, so a broken city never reaches the zip.
      - run: npm test
      # Multiplayer is paused: built without a game server, so the city runs on its
      # own (the whole city game in this browser's save).
      # To bring it back, set PUBLIC_GAME_SERVER here (see server/README.md).
      - run: npm run build
      # The city's textures made ahead and GPU-compressed (scripts/bake-textures.mjs): painted in a
      # headless Chromium from the built site, then written into dist/. If it can't run, it says so
      # and the site paints them in the browser as before.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run bake:textures
      # What a visitor downloads before the city is up, held to fixed sizes (scripts/budget.mjs):
      # a start that got heavier stops the build too.
      - run: npm run budget

      - uses: actions/upload-artifact@v4
        with:
          name: degenemporium-site
          path: dist/
          # .htaccess starts with a dot, and hidden files are left out unless asked for
          include-hidden-files: true
          retention-days: 30
