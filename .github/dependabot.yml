# Weekly update checks (docs/security-plan.md Phase 1): the site's packages, the game server's and the
# GitHub Actions (pinned to commit SHAs, so Dependabot moves the SHA and its version comment together).
# Each is one grouped pull request, never merged by itself: check the build and the tests first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      site:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      server:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
